app = "prime-gestionale-elite-deruvo"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  PRIME_EDITION = "elite"
  PRIME_DB = "/data/prime.sqlite"
  PRIME_BACKUP_DIR = "/data/backups"
  PRIME_BACKUP_RETENTION_DAYS = "30"
  PRIME_DEMO = "0"
  PRIME_PUBLIC_URL = "https://prime-gestionale-elite-deruvo.fly.dev"
  PRIME_CONNECT_PUBLIC_URL = "https://prime-gestionale-elite-deruvo.fly.dev"
  PRIME_ELEVEN_INBOUND_WEBHOOK_ENABLED = "true"

[deploy]
  strategy = "immediate"

[[mounts]]
  source = "prime_elite_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
